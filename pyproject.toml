[project]
name = "model-preview-generator"
version = "1.0.0"
description = "Generate preview images and GIFs from 3D models for web publishing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Renda"}
]
keywords = ["3d", "model", "preview", "gif", "glb", "gltf", "rendering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
requires-python = ">=3.10"
dependencies = [
    "pyrender>=0.1.45",
    "trimesh>=4.0.0",
    "imageio>=2.31.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
model-preview = "src.app:main"

[project.gui-scripts]
model-preview-gui = "src.app:main"

[project.urls]
Homepage = "https://github.com/renda/3d-model-to-gif"
Repository = "https://github.com/renda/3d-model-to-gif"
Issues = "https://github.com/renda/3d-model-to-gif/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
